aid: era
name: Era
description: 'Era is an AI-native personal finance platform that connects a user''s
  bank accounts to any MCP-compatible AI assistant — Claude, ChatGPT, Gemini, Cursor,
  and others — so people can analyze spending, forecast cash flow, automate transaction
  categorization, and manage money through natural conversation. Every capability is
  exposed through the Era Context remote MCP server (65 tools over Streamable HTTP,
  OAuth 2.1) rather than a traditional REST API, with a portable cross-agent memory
  layer, scoped consent, and hard safety boundaries. Founded in 2023 by Stripe alumni
  and backed by Northzone, Era is a registered investment adviser targeting the mass-affluent
  market across the US, UK, and Canada.'
